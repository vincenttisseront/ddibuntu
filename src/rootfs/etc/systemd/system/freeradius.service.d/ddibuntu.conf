# DDI-Buntu : FreeRADIUS lit UNIQUEMENT l'arborescence générée par ddibuntu-radius (/etc/ddibuntu/radius), jamais /etc/freeradius.
# Sans cette arborescence, le contrôle de démarrage échoue et le service ne démarre pas (pas de configuration du paquet, pas de secret par défaut).
[Service]
ExecStartPre=
ExecStartPre=/usr/sbin/freeradius -d /etc/ddibuntu/radius -Cx -lstdout
ExecStart=
ExecStart=/usr/sbin/freeradius -f -d /etc/ddibuntu/radius
ExecReload=
ExecReload=/usr/sbin/freeradius -d /etc/ddibuntu/radius -Cxm -lstdout
ExecReload=/bin/kill -HUP $MAINPID
ReadOnlyDirectories=/etc/ddibuntu/radius
