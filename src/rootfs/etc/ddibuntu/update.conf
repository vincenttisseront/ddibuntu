# Mises à jour en ligne (ddibuntu-selfupdate). Jamais écrasé par une mise à jour.
# REPO : dépôt GitHub dont les releases signées sont consultées (propriétaire/nom).
# AUTO_CHECK : 1 = recherche quotidienne d'une nouvelle version (aucune installation automatique) ; 0 = recherche manuelle seulement.
# Dépôt privé : placer un jeton GitHub en lecture seule dans /etc/ddibuntu/update-token (root, mode 0600).
REPO="vincenttisseront/ddibuntu"
AUTO_CHECK=1
