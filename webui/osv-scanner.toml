# Vulnérabilités connues des dépendances (osv-scanner, CI : job « deps » de .github/workflows/ci.yml).
# Toute vulnérabilité ABSENTE de cette liste fait échouer la CI. Chaque exception est motivée et a une date de fin :
# passé cette date, la CI échoue de nouveau et la dépendance doit être mise à niveau (ou l'exception justifiée à nouveau).
# Ligne de base relevée le 2026-11-22 (0.22.x) ; mise à niveau prévue : zod 4, vitest 4, nuxt (correctifs).

# --- Livré dans l'appliance
[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
effectiveUntil = 2027-01-31
reason = "zod 3 : épuisement mémoire sur collections démesurées. Corrigé en zod 4 seulement (migration majeure) ; l'API refuse en amont les corps > maxBodyBytes (413), ce qui borne la taille des collections validées."

