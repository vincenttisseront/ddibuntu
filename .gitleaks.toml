# Détection de secrets (gitleaks, CI : job « secrets » de .github/workflows/ci.yml). Règles par défaut de gitleaks, plus une exception étroite.
# L'exception ne vise QUE la règle heuristique « generic-api-key » : une clé privée, un jeton GitHub, AWS, Slack… reste bloquant partout, tests compris.
title = "gitleaks — appliance"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Jeux d'essai (secrets factices : DDI_SECRET_KEY de test, jetons et mots de passe inventés) et traductions (« Key compromise »…)"
paths = ['''^webui/tests/''', '''^tests/''', '''^webui/app/i18n/[a-z]+\.ts$''']
