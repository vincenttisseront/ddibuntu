# Intégration continue : contrôles qui ne demandent ni root, ni QEMU, ni chroot. Les batteries système (b03..b08) se rejouent sur une machine Linux avec droits root (docs/TESTING.md).
name: ci
on: [push, pull_request]
jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make lint
      - run: bash tests/b02-i18n.sh
      - run: bash tests/b09-selfupdate.sh
  console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: webui/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y bind9-utils kea-dhcp4-server   # les tests de rendu valident avec les outils officiels
      - run: tools/build-console.sh
      - run: tools/run-console-tests.sh unit
  repo-mode:
    runs-on: ubuntu-24.04
    needs: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: tools/build-console.sh
      - run: ./build-ddibuntu.sh --stage /tmp/stage && tools/make-single.sh
      - run: ./build-ddibuntu.sh --bundle --out /tmp/bundle && tar -tzf /tmp/bundle/ddibuntu-update-*.tar.gz
  # Qualité du code (SonarQube Cloud) : analyse + couverture des tests unitaires. Nécessite le secret SONAR_TOKEN (sans lui, l'étape d'analyse est sautée : forks, premier démarrage).
  # Penser à désactiver « Automatic Analysis » dans SonarQube Cloud (Administration → Analysis Method), sinon les deux analyses se contredisent.
  sonar:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                  # l'historique complet permet d'attribuer le « nouveau code »
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: webui/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y bind9-utils kea-dhcp4-server
      - run: tools/build-console.sh
      - run: cd webui && npx vitest run tests/unit-*.test.ts --coverage
      - name: Analyse SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
