# Analyse de sécurité du code (CodeQL) : console (JavaScript/TypeScript) et workflows GitHub Actions. Résultats : onglet Security du dépôt.
name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'      # chaque lundi : nouvelles requêtes CodeQL sur un code inchangé
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore: [webui/tests, tests, dist, webui/.output, webui/.nuxt]
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with: { category: '/language:${{ matrix.language }}' }
