# Publication, étape 1/2 — VERSION CANDIDATE. Un push sur main qui change src/VERSION :
#   1. rejoue toute la CI sur le commit exact (ci.yml) ;
#   2. construit UNE FOIS l'archive de mise à jour et le fichier unique (depuis la console testée par la CI), produit le SBOM ;
#   3. signe SHA256SUMS (Ed25519) dans un travail à part, rattaché à l'environment « release » (limité à main), qui ne voit que
#      SHA256SUMS et la clé : secret RELEASE_SIGNING_KEY (repli : ancien secret UPDATE_SIGNING_KEY pendant la transition). La clé
#      doit être une clé de confiance épinglée et la signature est contrôlée comme le ferait une appliance (tools/release-keys.sh) ;
#   4. publie le tout, avec l'attestation de provenance et les manifestes de rotation de clé du dépôt (keys/rotations) :
#      - variable DEV_VALIDATION = on : en PRÉ-VERSION vX.Y.Z ; les appliances (canal stable) ne la voient pas ; l'instance de
#        validation (canal prerelease) l'installe, la teste et rend son verdict à promote.yml (étape 2/2), qui en fait la release
#        publique sans rien reconstruire ;
#      - sinon (aucune instance de validation, réglage par défaut) : directement en release publique (« latest »).
# Voir docs/CI-CD.md et docs/RELEASING.md.
name: release
on:
  push:
    branches: [main]
    paths: ['src/VERSION']
  workflow_dispatch:      # relance après un échec de construction (aucune release créée) ; depuis main seulement
concurrency: { group: release, cancel-in-progress: false }
permissions:
  contents: read          # chaque travail ne reçoit que les droits qu'il utilise
jobs:
  gate:
    if: github.ref == 'refs/heads/main'       # jamais depuis une autre branche : la clé de signature ne signe que du code fusionné
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.g.outputs.skip }}
      version: ${{ steps.g.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_VALIDATION: ${{ vars.DEV_VALIDATION }}
        run: |
          # mode de publication : une valeur mal saisie ne doit jamais publier sans validation par erreur
          case "$DEV_VALIDATION" in on|off|'') ;; *) echo "::error::variable DEV_VALIDATION invalide : « $DEV_VALIDATION » (on, off ou absente)"; exit 1 ;; esac
          v="$(tr -d '\n' < src/VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::src/VERSION invalide : $v"; exit 1; }
          [ "$(tr -d '\n' < src/rootfs/usr/local/lib/ddibuntu/VERSION)" = "$v" ] || { echo "::error::les deux fichiers VERSION diffèrent"; exit 1; }
          grep -qE "^## $v( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md n'a pas de section ## $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # une version existante (candidate, rejetée ou publiée) n'est jamais reconstruite : on publie X.Y.Z+1
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "v$v existe déjà : rien à faire"; echo skip=true >> "$GITHUB_OUTPUT"
          else echo skip=false >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # seul secret transmis à la CI

  build:
    needs: [gate, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Console testée par la CI (même exécution)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: console-output, path: webui/.output }
      - name: Archive de mise à jour et fichier unique
        run: |
          ./build-ddibuntu.sh --bundle --out dist
          tools/make-single.sh dist
      - name: Sommes SHA-256 (signées par le travail « sign »)
        run: cd dist && sha256sum "ddibuntu-update-$VERSION.tar.gz" build-ddibuntu.sh > SHA256SUMS
      - name: SBOM de la console (CycloneDX, dépendances livrées)
        working-directory: webui
        run: |
          npm install --prefix /tmp/cdx --ignore-scripts --no-audit --no-fund @cyclonedx/cyclonedx-npm@7.0.1
          /tmp/cdx/node_modules/.bin/cyclonedx-npm --package-lock-only --omit dev --output-format JSON --output-file "../dist/sbom-console-$VERSION.cdx.json"
      - name: Notes de version (section du CHANGELOG + bandeau de validation)
        env:
          DEV_VALIDATION: ${{ vars.DEV_VALIDATION }}
        run: |
          {
            if [ "$DEV_VALIDATION" = on ]; then
              echo '<!-- validation:pending -->'
              echo '> ⏳ **Version candidate** — en validation sur l'"'"'instance de dev. Les appliances du canal stable ne la voient pas encore.'
            else
              echo '<!-- validation:none -->'
              echo '> Publiée directement : CI complète, signature Ed25519 et attestation de provenance. Pas d'"'"'instance de validation configurée.'
            fi
            echo '<!-- /validation -->'
            echo
            awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md
          } > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/ddibuntu-update-${{ env.VERSION }}.tar.gz
            dist/build-ddibuntu.sh
            dist/SHA256SUMS
            dist/sbom-console-${{ env.VERSION }}.cdx.json
            dist/notes.md

  # Signature : seul travail qui lit la clé privée. Il n'exécute ni la construction ni la console : il ne reçoit que SHA256SUMS.
  # La clé n'est visible que d'une étape qui n'exécute qu'openssl (signature + extraction de la clé PUBLIQUE), puis est détruite ;
  # les contrôles (scripts du dépôt) ne voient que la clé publique et la signature.
  sign:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            src/rootfs/etc/ddibuntu
            src/rootfs/usr/local/lib/ddibuntu/release-keys.sh
            tools/release-keys.sh
            keys
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: dist }
      - name: Signature de SHA256SUMS (Ed25519) — openssl seulement
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY || secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::secret RELEASE_SIGNING_KEY absent (environment release)"; exit 1; }
          key="$(mktemp)"; trap 'shred -u "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/signer.pub"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
      - name: La clé est une clé de confiance, ici et pour la dernière version publiée ; signature contrôlée comme sur une appliance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release-keys.sh check-rotations
          tools/release-keys.sh check-signer "$RUNNER_TEMP/signer.pub"
          tools/release-keys.sh verify dist/SHA256SUMS dist/SHA256SUMS.sig
          # continuité : les appliances à jour ont les clés de la DERNIÈRE release publiée (plus les manifestes de rotation joints
          # à celle-ci) ; une clé qu'elles ne connaissent pas produirait une version que toutes refuseraient
          prev="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$prev" ]; then echo "aucune release publiée : contrôle de continuité sans objet"; exit 0; fi
          [[ "$prev" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::dernière release au nom inattendu : $prev"; exit 1; }
          git fetch --no-tags --depth 1 origin "refs/tags/$prev:refs/tags/$prev"
          d="$(mktemp -d)"; mkdir -p "$d/keys"
          git archive "$prev" src/rootfs/etc/ddibuntu | tar -x -C "$d"
          cp -r keys/rotations "$d/keys/"
          RK_REPO="$d" tools/release-keys.sh check-signer "$RUNNER_TEMP/signer.pub" \
            || { echo "::error::la clé de signature n'est pas reconnue par $prev : les appliances refuseraient cette version (docs/RELEASING.md, bascule)"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signature
          retention-days: 30
          if-no-files-found: error
          path: dist/SHA256SUMS.sig

  publish:
    needs: [gate, build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write         # attestation de provenance (Sigstore) : donnée au seul travail qui n'exécute aucun code du dépôt
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      PRODUCT: ${{ vars.PRODUCT_NAME || 'Ipnoria' }}
      GH_TOKEN: ${{ github.token }}
      DEV_VALIDATION: ${{ vars.DEV_VALIDATION }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-files, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-signature, path: dist }
      # manifestes de rotation de clé (signés hors ligne par la clé de secours) : joints à CHAQUE release, pour qu'une appliance qui
      # saute des versions les trouve sur la dernière ; aucun code du dépôt n'est exécuté ici
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, path: src, sparse-checkout: keys/rotations, sparse-checkout-cone-mode: false }
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ddibuntu-update-${{ env.VERSION }}.tar.gz
            dist/build-ddibuntu.sh
            dist/sbom-console-${{ env.VERSION }}.cdx.json
      - name: Publication (pré-version si une instance de validation est configurée, sinon release publique)
        run: |
          case "$DEV_VALIDATION" in on) mode=(--prerelease) ;; off|'') mode=(--latest) ;; *) echo "::error::DEV_VALIDATION invalide"; exit 1 ;; esac
          rot=()
          for f in src/keys/rotations/key-rotation-[0-9][0-9][0-9].json src/keys/rotations/key-rotation-[0-9][0-9][0-9].json.sig; do
            if [ -f "$f" ]; then rot+=("$f"); fi
          done
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${mode[@]}" \
            --title "$PRODUCT $VERSION" --notes-file dist/notes.md \
            "dist/ddibuntu-update-$VERSION.tar.gz" dist/build-ddibuntu.sh dist/SHA256SUMS dist/SHA256SUMS.sig "dist/sbom-console-$VERSION.cdx.json" "${rot[@]}"
          {
            if [ "$DEV_VALIDATION" = on ]; then
              echo "### Version candidate $VERSION publiée"
              echo "En attente du verdict de l'instance de validation (promote.yml)."
            else
              echo "### Version $VERSION publiée"
              echo "Release publique, proposée aux appliances du canal stable à leur prochaine recherche."
            fi
            echo
            grep "ddibuntu-update-$VERSION.tar.gz" dist/SHA256SUMS | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
