# Publication : un push sur main qui change src/VERSION (ou un tag vX.Y.Z poussé à la main) construit l'archive de mise à jour en ligne et le fichier unique, signe SHA256SUMS
# (Ed25519, clé privée dans le secret UPDATE_SIGNING_KEY ; la clé publique épinglée est src/rootfs/etc/ddibuntu/update-pubkey.pem)
# puis crée la release GitHub que les appliances interrogent. Voir docs/RELEASING.md.
name: release
# La release crée elle-même le tag vX.Y.Z (sur le commit testé) : il suffit de pousser la nouvelle src/VERSION sur main.
# Si la release existe déjà, le travail s'arrête sans rien faire (modifier ce fichier ou src/VERSION sans changer de version est sans effet).
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['src/VERSION', '.github/workflows/release.yml']
concurrency: { group: release, cancel-in-progress: false }
permissions:
  contents: read          # le droit d'écriture n'est donné qu'au travail « release » (publication)
jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.g.outputs.skip }}
      tag: ${{ steps.g.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v="$(tr -d '\n' < src/VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "src/VERSION invalide : $v"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then echo "tag ${GITHUB_REF_NAME} différent de v$v (src/VERSION)"; exit 1; fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "release v$v déjà publiée : rien à faire"; echo skip=true >> "$GITHUB_OUTPUT"; else echo skip=false >> "$GITHUB_OUTPUT"; fi
  release:
    needs: gate
    permissions:
      contents: write
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: webui/package-lock.json }
      - name: Version publiée
        run: echo "VERSION=$(tr -d '\n' < src/VERSION)" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bind9-utils kea-dhcp4-server
      - run: make lint
      - run: tools/build-console.sh
      - run: tools/run-console-tests.sh unit
      - run: bash tests/b09-selfupdate.sh
      - name: Archive de mise à jour et fichier unique
        run: |
          ./build-ddibuntu.sh --bundle --out dist
          tools/make-single.sh dist
      - name: Signature de SHA256SUMS (Ed25519) et contrôle avec la clé publique du dépôt
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "secret UPDATE_SIGNING_KEY absent"; exit 1; }
          cd dist
          sha256sum "ddibuntu-update-$VERSION.tar.gz" build-ddibuntu.sh > SHA256SUMS
          key="$(mktemp)"; trap 'shred -u "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          openssl pkeyutl -verify -pubin -inkey ../src/rootfs/etc/ddibuntu/update-pubkey.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
      - name: Notes de version (section du CHANGELOG)
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $VERSION" > notes.md
      - name: Création de la release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "DDI-Buntu $VERSION" --notes-file notes.md \
            "dist/ddibuntu-update-$VERSION.tar.gz" dist/build-ddibuntu.sh dist/SHA256SUMS dist/SHA256SUMS.sig
