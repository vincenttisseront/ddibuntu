---
# Type d'identifiants AWX « Chaîne de publication (GitHub) » — à créer dans AWX : Administration → Types d'identifiants → Ajouter.
# Copier « inputs » dans « Configuration des entrées » et « injectors » dans « Configuration de l'injecteur ».
# Le jeton est un jeton à granularité fine limité AU SEUL dépôt de l'appliance, droits : Contents = Read and write (requis par
# l'API repository_dispatch), Metadata = Read. Durée de validité : 1 an au plus, à renouveler (docs/CI-CD.md).
inputs:
  fields:
    - id: repository
      type: string
      label: Dépôt GitHub (propriétaire/nom)
    - id: token
      type: string
      label: Jeton GitHub (granularité fine, dépôt de l'appliance seulement)
      secret: true
  required: [repository, token]
injectors:
  env:
    GITHUB_REPOSITORY: "{{ repository }}"
    GITHUB_TOKEN: "{{ token }}"
