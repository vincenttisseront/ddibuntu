# Analyse SonarQube Cloud (lancée par la CI : .github/workflows/ci.yml, job « sonar »). Plan de remédiation : docs/QUALITE.md.
sonar.organization=vincenttisseront
sonar.projectKey=vincenttisseront_ddibuntu
sonar.projectName=ddibuntu

# Code livré / code de test : les batteries de tests ne sont pas du code de production
sonar.sources=webui/app,webui/server,src,tools,build-ddibuntu.sh,.github
sonar.tests=tests,webui/tests
sonar.test.inclusions=tests/**,webui/tests/**
sonar.exclusions=**/node_modules/**,dist/**,webui/.output/**,webui/.nuxt/**,webui/coverage/**,**/*.min.js
sonar.sourceEncoding=UTF-8

# Couverture (tests unitaires de la console, rapport lcov produit par vitest)
sonar.javascript.lcov.reportPaths=webui/coverage/lcov.info
sonar.coverage.exclusions=webui/app/**,webui/server/api/**,src/**,tools/**,build-ddibuntu.sh

# Les deux fichiers de traduction se ressemblent par construction
sonar.cpd.exclusions=webui/app/i18n/*.ts

# Règles écartées avec justification (voir docs/QUALITE.md)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7
# S1313 : adresses IP en dur — ce sont les plages réservées (RFC 1918, lien local, multicast…) que le produit doit connaître pour les classer
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=webui/**
# S7688 : « préférer [[ ]] » ne s'applique pas aux scripts POSIX sh (installateur, mise à jour) où [[ n'existe pas
sonar.issue.ignore.multicriteria.e2.ruleKey=shell:S7688
sonar.issue.ignore.multicriteria.e2.resourceKey=src/iso/**
# Accessibilité : Sonar ne voit pas les <input> rendus par les composants Nuxt UI (UInput, UCheckbox…) à l'intérieur d'un <label> ou d'un UFormField
# (l'association est faite à l'exécution) ; autocomplete posé sur le composant, canvas cliquable doté d'un résumé textuel. Vérifié à la main (docs/QUALITE.md).
# S7688 dans les batteries de tests (code de test : tests/**) : hors périmètre de la remédiation, ces scripts ne sont pas livrés
sonar.issue.ignore.multicriteria.e7.ruleKey=shell:S7688
sonar.issue.ignore.multicriteria.e7.resourceKey=tests/**
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:S6853
sonar.issue.ignore.multicriteria.e3.resourceKey=webui/app/**
sonar.issue.ignore.multicriteria.e4.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.e4.resourceKey=webui/app/**
sonar.issue.ignore.multicriteria.e5.ruleKey=Web:S6842
sonar.issue.ignore.multicriteria.e5.resourceKey=webui/app/**
sonar.issue.ignore.multicriteria.e6.ruleKey=Web:S6843
sonar.issue.ignore.multicriteria.e6.resourceKey=webui/app/**
